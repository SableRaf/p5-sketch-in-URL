<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sketch-in-URL Fragment PoC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700&display=swap" />
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --header: #f6f8fa;
      --hover: #eaeef2;
      --accent: #ed225d;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.75rem;
      padding: 0.4rem 0.75rem;
      background: var(--header);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      padding: 0.1rem 0.45rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .header-side {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      min-width: 0;
    }

    .header-side.end { justify-content: flex-end; }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      height: 34px;
      margin-left: 0.5rem;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--fg);
      font: 500 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }

    .switch:hover .switch-track { filter: brightness(0.95); }
    .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    .switch-track {
      position: relative;
      width: 30px;
      height: 18px;
      border-radius: 999px;
      background: #c4c9cf;
      transition: background 0.15s;
    }

    .switch-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.25);
      transition: transform 0.15s;
    }

    .switch[aria-checked="true"] .switch-track { background: var(--accent); }
    .switch[aria-checked="true"] .switch-thumb { transform: translateX(12px); }

    .url-bar {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.75rem;
      background: var(--header);
      border-bottom: 1px solid var(--border);
    }

    .url-bar label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }

    #share-url {
      flex: 1;
      min-width: 0;
      height: 30px;
      padding: 0 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    #share-url:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .icon-btn:hover { background: var(--hover); }
    .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .transport {
      flex-shrink: 0;
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #d9d9d9;
      color: #333;
      cursor: pointer;
    }

    .transport:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .transport:hover { filter: brightness(0.95); }
    .transport.active { background: var(--accent); color: #fff; }
    .transport svg { width: 14px; height: 14px; fill: currentColor; }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #copy .icon-check { display: none; }
    #copy.copied .icon-link { display: none; }
    #copy.copied .icon-check { display: block; }

    #tooltip {
      position: fixed;
      z-index: 1000;
      max-width: 260px;
      padding: 0.35rem 0.55rem;
      border-radius: 5px;
      background: #1f2328;
      color: #fff;
      font: 12px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s;
    }

    #tooltip.visible { opacity: 1; }

    .status {
      margin: 0 0.25rem;
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
    }

    .pane { min-width: 0; min-height: 0; }

    .editor-pane { border-right: 1px solid var(--border); }

    .CodeMirror {
      height: 100%;
      font: 16px/1.2 Inconsolata, monospace;
    }

    /* p5.js web editor light theme (client/styles/components/_editor.scss). */
    .cm-s-p5-light.CodeMirror { background: #fbfbfb; color: #333; }
    .cm-s-p5-light .CodeMirror-lines { padding-top: 4px; }
    .cm-s-p5-light pre.CodeMirror-line,
    .cm-s-p5-light pre.CodeMirror-line-like { padding: 0 4px; }
    .cm-s-p5-light .CodeMirror-gutters { min-width: 28px; background: #fbfbfb; border-right: 1px solid #d9d9d9; }
    .cm-s-p5-light .CodeMirror-linenumber { color: #666; text-align: center; padding: 0 4px; }
    .cm-s-p5-light .CodeMirror-cursor { border-left-color: #333; }
    .cm-s-p5-light .CodeMirror-selected,
    .cm-s-p5-light.CodeMirror-focused .CodeMirror-selected,
    .cm-s-p5-light .CodeMirror-line::selection,
    .cm-s-p5-light .CodeMirror-line > span::selection,
    .cm-s-p5-light .CodeMirror-line > span > span::selection { background: #d9d9d9; }
    .cm-s-p5-light .CodeMirror-activeline-background { background: #cfcfcf44; }
    .cm-s-p5-light .CodeMirror-matchingbracket { color: inherit !important; outline: 1px solid #333; outline-offset: 1px; }

    .cm-s-p5-light .cm-comment { color: #747474; }
    .cm-s-p5-light .cm-variable,
    .cm-s-p5-light .cm-variable-2,
    .cm-s-p5-light .cm-variable-3,
    .cm-s-p5-light .cm-type,
    .cm-s-p5-light .cm-def { color: #0b7ca9; }
    .cm-s-p5-light .cm-string,
    .cm-s-p5-light .cm-string-2 { color: #47820a; }
    .cm-s-p5-light .cm-regexp { color: #a06801; }
    .cm-s-p5-light .cm-number { color: #333; }
    .cm-s-p5-light .cm-atom { color: #d52889; }
    .cm-s-p5-light .cm-keyword,
    .cm-s-p5-light .cm-operator { color: #7a5a3a; }
    .cm-s-p5-light .cm-tag { color: #d52889; }
    .cm-s-p5-light .cm-property,
    .cm-s-p5-light .cm-attribute { color: #333; }
    .cm-s-p5-light .cm-p5-function { color: #0b7ca9; font-weight: bold; }
    .cm-s-p5-light .cm-p5-variable { color: #d52889; }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }

    .fab {
      display: none;
      position: fixed;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      z-index: 10;
      place-items: center;
      width: 56px;
      height: 56px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgb(0 0 0 / 0.3);
      cursor: pointer;
    }

    .fab:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    .fab svg { width: 20px; height: 20px; fill: currentColor; }
    .fab .icon-stop, .playing .fab .icon-play { display: none; }
    .playing .fab .icon-stop { display: block; }

    /* Mobile: one pane at a time (code when stopped, canvas when playing),
       a single play/stop FAB, and no auto-refresh. */
    @media (max-width: 720px) {
      /* Both panes share one cell; visibility (not display:none) keeps the
         iframe laid out so the sketch renders when it's revealed. */
      main { grid-template-columns: 1fr; }
      .pane { grid-area: 1 / 1; }
      .editor-pane { border-right: 0; }
      .preview-pane, .playing .editor-pane { visibility: hidden; }
      .playing .preview-pane { visibility: visible; }
      .status, #run, #stop, #auto { display: none; }
      .fab { display: grid; }
      .CodeMirror-lines { padding-bottom: 88px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-side">
      <button class="transport" id="run" data-tip="Run sketch (Ctrl/Cmd+Enter)" aria-label="Run">
        <svg viewBox="0 0 24 24"><polygon points="6 3 22 12 6 21" /></svg>
      </button>
      <button class="transport active" id="stop" data-tip="Stop sketch" aria-label="Stop">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" /></svg>
      </button>
      <button class="switch" id="auto" role="switch" aria-checked="false" data-tip="Re-run the sketch as you type">
        <span class="switch-track"><span class="switch-thumb"></span></span>
        Auto-refresh
      </button>
    </div>

    <h1>Sketch-in-URL <span class="badge">Proof of Concept - do not use</span></h1>

    <div class="header-side end">
      <button class="icon-btn" id="info" aria-label="About"
        data-tip="The whole sketch is stored in the URL after #sketch=, encoded as base64url. Nothing is uploaded: the fragment never leaves your browser. Share the link and anyone who opens it gets the same code. Press play to run it.">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v5" /><path d="M12 8h.01" /></svg>
      </button>
    </div>
  </header>

  <div class="url-bar">
    <label for="share-url">Share URL</label>
    <input id="share-url" type="text" readonly spellcheck="false" />
    <span class="status" id="status"></span>
    <button class="icon-btn" id="copy" data-tip="Copy share URL" aria-label="Copy share URL">
      <svg class="icon-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7" /><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7" /></svg>
      <svg class="icon-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></svg>
    </button>
    <a class="icon-btn" id="open" href="#" target="_blank" rel="noopener" data-tip="Open share URL in new tab" aria-label="Open share URL in new tab">
      <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><path d="M15 3h6v6" /><path d="M10 14 21 3" /></svg>
    </a>
  </div>

  <div id="tooltip" role="tooltip"></div>

  <main>
    <div class="pane editor-pane"><textarea id="sketch"></textarea></div>
    <div class="pane preview-pane"><iframe id="preview" sandbox="allow-scripts allow-pointer-lock" title="Sketch preview"></iframe></div>
  </main>

  <button class="fab" id="fab" aria-label="Run">
    <svg class="icon-play" viewBox="0 0 24 24"><polygon points="6 3 22 12 6 21" /></svg>
    <svg class="icon-stop" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" /></svg>
  </button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script>
    // One shared tooltip so only a single tip can show at a time.
    const tooltipEl = document.querySelector("#tooltip");
    let tipTarget = null;
    let tipTimer;

    function showTip(el, delay = 300, text = el.dataset.tip) {
      clearTimeout(tipTimer);
      tipTimer = setTimeout(() => {
        tipTarget = el;
        tooltipEl.textContent = text;
        const r = el.getBoundingClientRect();
        const w = tooltipEl.offsetWidth;
        const left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
        tooltipEl.style.left = `${left}px`;
        tooltipEl.style.top = `${r.bottom + 6}px`;
        tooltipEl.classList.add("visible");
      }, delay);
    }

    function hideTip() {
      clearTimeout(tipTimer);
      tipTarget = null;
      tooltipEl.classList.remove("visible");
    }

    document.querySelectorAll("[data-tip]").forEach((el) => {
      el.addEventListener("mouseenter", () => showTip(el));
      el.addEventListener("mouseleave", hideTip);
      el.addEventListener("focus", () => { if (el.matches(":focus-visible")) showTip(el, 0); });
      el.addEventListener("blur", hideTip);
    });

    document.querySelector("#info").addEventListener("click", (e) => {
      const el = e.currentTarget;
      if (tipTarget === el) hideTip(); else showTip(el, 0);
    });

    document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideTip(); });
    window.addEventListener("resize", hideTip);
    const P5_URL = "https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js";

    const statusEl = document.querySelector("#status");
    const openEl = document.querySelector("#open");
    const previewEl = document.querySelector("#preview");
    const autoEl = document.querySelector("#auto");
    const shareUrlEl = document.querySelector("#share-url");
    const fabEl = document.querySelector("#fab");
    const mobileQuery = matchMedia("(max-width: 720px)");

    const defaultSketch = `function setup() {
  createCanvas(400, 400);
}

function draw() {
  background(220);
  circle(width / 2, height / 2, 100);
}`;

    // Keyword lists from the p5.js web editor (client/utils/p5-keywords.js).
    const p5Functions = new Set(`
      describe describeElement textOutput gridOutput alpha blue brightness color green hue
      lerpColor lightness red saturation beginClip endClip clip background clear colorMode fill
      noFill noStroke stroke erase noErase arc ellipse circle line point quad rect square
      triangle ellipseMode noSmooth rectMode smooth strokeCap strokeJoin strokeWeight bezier
      bezierDetail bezierPoint bezierTangent curve curveDetail curveTightness curvePoint
      curveTangent beginContour beginShape bezierVertex curveVertex endContour endShape
      quadraticVertex vertex normal print cursor frameRate getTargetFrameRate noCursor
      windowResized fullscreen pixelDensity displayDensity getURL getURLPath getURLParams
      preload setup draw remove createCanvas resizeCanvas noCanvas createGraphics
      createFramebuffer clearDepth blendMode noLoop loop isLooping push pop redraw p5
      applyMatrix resetMatrix rotate rotateX rotateY rotateZ scale shearX shearY translate
      storeItem getItem clearStorage removeItem createStringDict createNumberDict select
      selectAll removeElements changed input createDiv createP createSpan createImg createA
      createSlider createButton createCheckbox createSelect createRadio createColorPicker
      createInput createFileInput createVideo createAudio createCapture createElement
      setMoveThreshold setShakeThreshold deviceMoved deviceTurned deviceShaken keyPressed
      keyReleased keyTyped keyIsDown mouseMoved mouseDragged mousePressed mouseReleased
      mouseClicked doubleClicked mouseWheel requestPointerLock exitPointerLock touchStarted
      touchMoved touchEnded createImage saveCanvas saveFrames loadImage saveGif image tint
      noTint imageMode blend copy filter get loadPixels set updatePixels loadJSON loadStrings
      loadTable loadXML loadBytes httpGet httpPost httpDo createWriter save saveJSON saveStrings
      saveTable abs ceil constrain dist exp floor lerp log mag map max min norm pow round sq
      sqrt fract createVector noise noiseDetail noiseSeed randomSeed random randomGaussian acos
      asin atan atan2 cos sin tan degrees radians angleMode textAlign textLeading textSize
      textStyle textWidth textAscent textDescent textWrap loadFont text textFont append
      arrayCopy concat reverse shorten shuffle sort splice subset float int str boolean byte
      char unchar hex unhex join match matchAll nf nfc nfp nfs split splitTokens trim day hour
      minute millis month second year beginGeometry endGeometry buildGeometry freeGeometry plane
      box sphere cylinder cone ellipsoid torus orbitControl debugMode noDebugMode ambientLight
      specularColor directionalLight pointLight imageLight panorama lights lightFalloff
      spotLight noLights loadModel model loadShader createShader createFilterShader shader
      resetShader texture textureMode textureWrap normalMaterial ambientMaterial
      emissiveMaterial specularMaterial shininess metalness camera perspective linePerspective
      ortho frustum createCamera setCamera setAttributes getAudioContext userStartAudio
      getOutputVolume outputVolume sampleRate freqToMidi midiToFreq soundFormats saveSound
      loadSound createConvolver setBPM
    `.trim().split(/\s+/));
    const p5Variables = new Set(`
      VERSION P2D WEBGL WEBGL2 ARROW CROSS HAND MOVE TEXT WAIT HALF_PI PI QUARTER_PI TAU TWO_PI
      DEGREES RADIANS CORNER CORNERS RADIUS RIGHT LEFT CENTER TOP BOTTOM BASELINE POINTS LINES
      LINE_STRIP LINE_LOOP TRIANGLES TRIANGLE_FAN TRIANGLE_STRIP QUADS QUAD_STRIP TESS CLOSE
      OPEN CHORD PIE PROJECT SQUARE ROUND BEVEL MITER RGB HSB HSL AUTO ALT BACKSPACE CONTROL
      DELETE DOWN_ARROW ENTER ESCAPE LEFT_ARROW OPTION RETURN RIGHT_ARROW SHIFT TAB UP_ARROW
      BLEND REMOVE ADD DARKEST LIGHTEST DIFFERENCE SUBTRACT EXCLUSION MULTIPLY SCREEN REPLACE
      OVERLAY HARD_LIGHT SOFT_LIGHT DODGE BURN THRESHOLD GRAY OPAQUE INVERT POSTERIZE DILATE
      ERODE BLUR NORMAL ITALIC BOLD BOLDITALIC CHAR WORD LINEAR QUADRATIC BEZIER CURVE STROKE
      FILL TEXTURE IMMEDIATE IMAGE NEAREST REPEAT CLAMP MIRROR FLAT SMOOTH LANDSCAPE PORTRAIT
      GRID AXES LABEL FALLBACK CONTAIN COVER UNSIGNED_BYTE UNSIGNED_INT FLOAT HALF_FLOAT RGBA
      frameCount deltaTime focused webglVersion displayWidth displayHeight windowWidth
      windowHeight width height disableFriendlyErrors drawingContext deviceOrientation
      accelerationX accelerationY accelerationZ pAccelerationX pAccelerationY pAccelerationZ
      rotationX rotationY rotationZ pRotationX pRotationY pRotationZ turnAxis keyIsPressed key
      keyCode movedX movedY mouseX mouseY pmouseX pmouseY winMouseX winMouseY pwinMouseX
      pwinMouseY mouseButton mouseIsPressed touches pixels soundOut
    `.trim().split(/\s+/));

    // Wrap the JavaScript mode so p5 identifiers get the same classes the
    // web editor uses (cm-p5-function / cm-p5-variable).
    CodeMirror.defineMode("p5js", (config) => {
      const js = CodeMirror.getMode(config, "javascript");
      return {
        ...js,
        token(stream, state) {
          const style = js.token(stream, state);
          // CM5 uses string-2 for both template strings and regexps.
          if (style === "string-2" && stream.current().startsWith("/")) return "regexp";
          if (style === "variable" || style === "def") {
            const word = stream.current();
            if (p5Functions.has(word)) return "p5-function";
            if (p5Variables.has(word)) return "p5-variable";
          }
          return style;
        },
      };
    });

    const editor = CodeMirror.fromTextArea(document.querySelector("#sketch"), {
      mode: "p5js",
      theme: "p5-light",
      lineNumbers: true,
      styleActiveLine: true,
      matchBrackets: true,
      tabSize: 2,
      indentUnit: 2,
      extraKeys: {
        "Ctrl-Enter": () => run(),
        "Cmd-Enter": () => run(),
      },
    });

    function bytesToBase64Url(bytes) {
      let binary = "";
      const chunkSize = 0x8000;

      for (let i = 0; i < bytes.length; i += chunkSize) {
        const chunk = bytes.subarray(i, i + chunkSize);
        binary += String.fromCharCode(...chunk);
      }

      return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/g, "");
    }

    function base64UrlToBytes(value) {
      const base64 = value
        .replace(/-/g, "+")
        .replace(/_/g, "/")
        .padEnd(Math.ceil(value.length / 4) * 4, "=");

      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      return bytes;
    }

    function encodeText(text) {
      return bytesToBase64Url(new TextEncoder().encode(text));
    }

    function decodeText(value) {
      return new TextDecoder().decode(base64UrlToBytes(value));
    }

    function basePageUrl() {
      return location.href.split("#")[0].split("?")[0];
    }

    function buildShareUrl() {
      return `${basePageUrl()}#sketch=${encodeText(editor.getValue())}`;
    }

    function updateUi(url = buildShareUrl()) {
      openEl.href = url;
      shareUrlEl.value = url;
      const utf8Bytes = new TextEncoder().encode(editor.getValue()).length;
      statusEl.textContent =
        `${utf8Bytes.toLocaleString()} B · URL ${url.length.toLocaleString()} chars`;
    }

    function syncFragment() {
      const url = buildShareUrl();
      history.replaceState(null, "", url);
      updateUi(url);
      return url;
    }

    function run() {
      syncFragment();
      // Escape closing script tags so user code can't break out of the wrapper.
      const code = editor.getValue().replace(/<\/script/gi, "<\\/script");
      previewEl.srcdoc = `<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0}</style>
<script src="${P5_URL}"><\/script>
</head><body><script>${code}<\/script></body></html>`;
      setPlaying(true);
    }

    function setPlaying(playing) {
      document.querySelector("#run").classList.toggle("active", playing);
      document.querySelector("#stop").classList.toggle("active", !playing);
      document.body.classList.toggle("playing", playing);
      fabEl.setAttribute("aria-label", playing ? "Stop" : "Run");
    }

    function stop() {
      previewEl.srcdoc = "";
      setPlaying(false);
    }

    function loadFromFragment() {
      const encoded = new URLSearchParams(location.hash.slice(1)).get("sketch");

      if (!encoded) {
        editor.setValue(defaultSketch);
      } else {
        try {
          editor.setValue(decodeText(encoded));
        } catch (error) {
          editor.setValue(defaultSketch);
          statusEl.textContent = `Could not decode fragment: ${error.message}`;
        }
      }

      updateUi();
      stop();
    }

    // Briefly show a confirmation in the tooltip anchored to `el`.
    function flash(el, message) {
      showTip(el, 0, message);
      tipTimer = setTimeout(() => { if (tipTarget === el) hideTip(); }, 1200);
    }

    document.querySelector("#run").addEventListener("click", run);
    document.querySelector("#stop").addEventListener("click", stop);
    fabEl.addEventListener("click", () => {
      if (document.body.classList.contains("playing")) stop(); else run();
    });

    // Auto-refresh is unavailable on mobile: switch it off when entering that layout.
    function disableAutoOnMobile() {
      if (mobileQuery.matches) autoEl.setAttribute("aria-checked", "false");
    }
    mobileQuery.addEventListener("change", disableAutoOnMobile);
    disableAutoOnMobile();

    autoEl.addEventListener("click", () => {
      const on = autoEl.getAttribute("aria-checked") !== "true";
      autoEl.setAttribute("aria-checked", String(on));
      if (on) run();
    });

    document.querySelector("#copy").addEventListener("click", async (e) => {
      const el = e.currentTarget;
      const url = syncFragment();
      try {
        await navigator.clipboard.writeText(url);
        flash(el, "Copied share URL");
        el.classList.add("copied");
        clearTimeout(el.copiedTimer);
        el.copiedTimer = setTimeout(() => el.classList.remove("copied"), 1200);
      } catch {
        flash(el, "Copy failed");
      }
    });

    openEl.addEventListener("click", () => syncFragment());

    shareUrlEl.addEventListener("focus", () => shareUrlEl.select());


    let autoTimer;
    editor.on("change", () => {
      updateUi();
      if (autoEl.getAttribute("aria-checked") === "true" && !mobileQuery.matches) {
        clearTimeout(autoTimer);
        autoTimer = setTimeout(run, 600);
      }
    });

    window.addEventListener("hashchange", () => {
      if (location.href !== buildShareUrl()) loadFromFragment();
    });

    loadFromFragment();
  </script>
</body>
</html>
